name: Build and publish the image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/driin0/ha-mcp-server

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Un runner nativo per architettura, invece di QEMU su un runner solo.
          # Le dipendenze hanno estensioni native che su Alpine si compilano da
          # sorgente: sotto emulazione lo stesso build passa da minuti a decine
          # di minuti. I runner arm64 sono gratuiti sui repository pubblici.
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true
          labels: |
            org.opencontainers.image.source=https://github.com/driin0/ha-mcp-server
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.description=MCP server for Home Assistant

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.suffix }}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Publish the multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create the manifest from the per-architecture digests
        run: |
          set -eu
          REFS=""
          for f in /tmp/digests/*; do
            REFS="$REFS ${IMAGE}@$(cat "$f")"
          done
          # Le label del build finiscono solo nei config delle immagini per
          # architettura: l'index che le raccoglie nasce senza. GitHub legge
          # l'index, e senza image.source non collega il package a questo
          # repository — lo lascia dov'era quando il nome è stato registrato.
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/driin0/ha-mcp-server" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --annotation "index:org.opencontainers.image.description=MCP server for Home Assistant" \
            -t "${IMAGE}:${{ steps.version.outputs.value }}" \
            -t "${IMAGE}:latest" \
            $REFS

      - name: Inspect the result
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.value }}"
