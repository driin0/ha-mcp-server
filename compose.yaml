name: ha-mcp-server

services:
  mcp:
    # Immagine multi-architettura pubblicata a ogni tag: installare non
    # richiede di compilare nulla. Per lavorare sul codice, sostituire con
    # `build: .`.
    image: ghcr.io/driin0/ha-mcp-server:latest
    ports:
      - "${MCP_PORT:-47821}:47821"
      - "${UI_PORT:-47822}:47822"
    environment:
      - HA_URL=${HA_URL:?serve l'indirizzo di Home Assistant, es. http://homeassistant.local:8123}
      - HA_TOKEN=${HA_TOKEN:?serve un long-lived access token di Home Assistant}
      - MCP_SECRET=${MCP_SECRET:-}
      - MCP_ALLOW_NO_AUTH=${MCP_ALLOW_NO_AUTH:-}
      - UI_SECRET=${UI_SECRET:-}
      - HA_DEFAULT_LANGUAGE=${HA_DEFAULT_LANGUAGE:-}
      - HA_ALEXA_KEYWORDS=${HA_ALEXA_KEYWORDS:-}
      - HA_REMOTE_PREFIXES=${HA_REMOTE_PREFIXES:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:47822/api/status', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
